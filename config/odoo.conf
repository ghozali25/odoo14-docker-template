[options]
; Password master untuk membuat/menghapus database dari halaman /web/database.
; GANTI sebelum dipakai untuk client.
admin_passwd = ganti-admin-password-ini

db_host = db
db_port = 5432
; Harus sama dengan POSTGRES_USER / POSTGRES_PASSWORD di file .env
db_user = odoo14
db_password = ganti-dengan-password-acak-yang-kuat
dbfilter =
list_db = True

addons_path = /opt/odoo/addons,/mnt/extra-addons,/mnt/custom-addons
data_dir = /var/lib/odoo

; Setelan hemat untuk VPS kecil (mulai 1 GB RAM).
; Naikkan workers bila RAM lebih besar (patokan kasar: 1 worker per 1 CPU + cron).
workers = 0
max_cron_threads = 1
limit_memory_soft = 536870912
limit_memory_hard = 805306368
limit_time_cpu = 600
limit_time_real = 1200

log_level = info
proxy_mode = False
